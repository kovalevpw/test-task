version: '3.4'
services:
  backend:
    image: 'docker.io/kovalevpw/php-developer:php-8.2'
    user: '1000:1000'
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/supervisor:/etc/supervisor/conf.d
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_PORT: 3306
      MYSQL_DATABASE: test-task
      MYSQL_USER: test-task
      MYSQL_PASSWORD: test-task
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306/tcp'
    volumes:
      - /var/log/mysql
      - /var/lib/mysql
  nginx:
    image: nginx:1.21
    ports:
      - '80:80/tcp'
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
  composer:
    image: composer:2.8
    working_dir: /var/www/html
    user: '1000:1000'
    volumes:
      - ./backend:/var/www/html
    command: bash
